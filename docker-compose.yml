version: '3.9'

services:

  postgres:
    image: postgres:17

    container_name: ai-assistant-postgres

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_assistant_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ai-assistant-api

    restart: always

    depends_on:
      - postgres

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=ai_assistant_db;Username=postgres;Password=postgres

    ports:
      - "5000:8080"

volumes:
  postgres_data: