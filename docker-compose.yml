services:
  postgres:
    image: postgres:17
    container_name: ai-assistant-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_assistant_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-assistant-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=ai_assistant_db;Username=postgres;Password=postgres
      Jwt__Key: 7F1E3C8A5B9D2E4F6A1C7D8B3E5F9A2C6D4E1B8F7A3C5D9E
      Jwt__Issuer: SmartSupport
      Jwt__Audience: SmartSupportClient
    ports:
      - "5000:8080"
    volumes:
      - api_logs:/app/logs

volumes:
  postgres_data:
  api_logs:
